[package]
name = "rlse"
version = "0.2.0"
edition = "2021"
description = "RLSE: High-throughput, fault-tolerant LLM inference engine and continuous batching control plane in Rust"
authors = ["Harsha Karimikonda <harshakarimikonda22@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Harsha-Karimikonda/rlse"
homepage = "https://github.com/Harsha-Karimikonda/rlse"
documentation = "https://docs.rs/rlse"
readme = "README.md"
keywords = ["llm", "inference", "continuous-batching", "candle", "vllm"]
categories = ["science", "command-line-utilities", "web-programming::http-server"]

[lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
manual_string_new = "warn"
unused_self = "warn"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros", "tokio"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
async-trait = "0.1"
parking_lot = "0.12"
clap = { version = "4.5", features = ["derive", "env"] }
sysinfo = "0.31"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Candle backend for Hugging Face models (Metal/CUDA/CPU)
candle-core = "0.11"
candle-transformers = "0.11"
candle-nn = "0.11"
tokenizers = "0.21"
hf-hub = "0.4"
minijinja = { version = "2.21", features = ["loader", "json", "fuel"] }
minijinja-contrib = { version = "2.21", features = ["pycompat"] }

[features]
default = []
metal = ["candle-core/metal"]
cuda = ["candle-core/cuda"]

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-test = "0.4"
http-body-util = "0.1"
