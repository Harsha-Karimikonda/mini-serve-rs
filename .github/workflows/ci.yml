name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (rustfmt)
        run: cargo fmt --check

      - name: Run Clippy (CPU / default features)
        run: cargo clippy --locked --all-targets -- -D warnings

  test-linux:
    name: Tests (Linux / CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Python for GPU harness regressions
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Test GPU validation harness (no GPU required)
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Run tests (CPU)
        run: cargo test --locked --all-targets

  test-macos:
    name: Tests & Linting (macOS / Metal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy (Metal)
        run: cargo clippy --locked --features metal --all-targets -- -D warnings

      - name: Run tests (Metal)
        run: cargo test --locked --features metal
